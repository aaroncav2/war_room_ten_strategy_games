name: iOS – build and upload to TestFlight

on:
  workflow_dispatch:        # run it by hand: Actions tab -> this workflow -> Run workflow
  push:
    tags: ['v*']            # or push a tag like v1.0.1

jobs:
  ios:
    runs-on: macos-26       # Apple requires Xcode 26+ for App Store uploads
    timeout-minutes: 45
    env:
      BUNDLE_ID:       ${{ vars.BUNDLE_ID }}
      ADMOB_APP_ID:    ${{ vars.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
      APP_VERSION:     ${{ vars.APP_VERSION || '1.0.0' }}
      ASC_KEY_ID:      ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:   ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8:      ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID:         ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        run: |
          missing=""
          for v in BUNDLE_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repo settings:$missing  (see README_IOS.md, step 4)"; exit 1
          fi
          if [ -z "$ADMOB_APP_ID" ] || [ -z "$ADMOB_BANNER_ID" ]; then
            echo "::warning::ADMOB_APP_ID / ADMOB_BANNER_ID not set - this build shows Google TEST ads only."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Xcode version
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          [ "$major" -ge 26 ] || { echo "::error::Xcode 26+ required for App Store uploads"; exit 1; }

      - run: npm ci

      - name: Prepare web assets and native iOS project
        run: bash scripts/prepare.sh

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            | tee "$RUNNER_TEMP/archive.log" | tail -n 40

      - name: Export and upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/export.log" | tail -n 40

      - name: Save logs if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
