
name: iOS - build and upload to TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60

    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
      APP_VERSION: ${{ vars.APP_VERSION || '1.0.0' }}

      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check settings
        run: |
          missing=""
          for v in BUNDLE_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID \
                   IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD \
                   IOS_PROVISION_PROFILE_BASE64; do
            [ -n "${!v}" ] || missing="$missing $v"
          done

          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets or variables:$missing"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Xcode version
        run: |
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets and native iOS project
        run: bash scripts/prepare.sh

      # Install Apple Distribution certificate
      
      - name: Verify Apple certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os, base64
          from pathlib import Path

          data = base64.b64decode(
              os.environ["IOS_CERTIFICATE_BASE64"],
              validate=True
          )

          Path("/tmp/test-certificate.p12").write_bytes(data)
          print("Certificate decoded successfully.")
          print("File size:", len(data), "bytes.")
          PY

          openssl pkcs12 \
            -in /tmp/test-certificate.p12 \
            -passin env:IOS_CERTIFICATE_PASSWORD \
            -info -noout


      - name: Install Apple signing certificate
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/warroom-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$KEYCHAIN_PATH" > "$RUNNER_TEMP/keychain-path"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          python3 - <<'PY'
          import os, base64
          from pathlib import Path

          data = base64.b64decode(
              os.environ["IOS_CERTIFICATE_BASE64"]
          )
          Path(os.environ["RUNNER_TEMP"] + "/certificate.p12").write_bytes(data)
          PY

          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # Install App Store provisioning profile
      - name: Install provisioning profile
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os, base64
          from pathlib import Path

          data = base64.b64decode(
              os.environ["IOS_PROVISION_PROFILE_BASE64"]
          )
          Path(os.environ["RUNNER_TEMP"] + "/profile.mobileprovision").write_bytes(data)
          PY

          security cms -D \
            -i "$RUNNER_TEMP/profile.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c "Print :UUID" "$RUNNER_TEMP/profile.plist")

          PROFILE_NAME=$(/usr/libexec/PlistBuddy \
            -c "Print :Name" "$RUNNER_TEMP/profile.plist")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo "Installed profile: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"

      # Configure signing ONLY for the App target.
      # Do not pass Apple Distribution globally to xcodebuild.
      - name: Configure App target signing
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os, re
          from pathlib import Path

          pbx = Path("ios/App/App.xcodeproj/project.pbxproj")
          s = pbx.read_text()

          bundle = os.environ["BUNDLE_ID"]
          team = os.environ["TEAM_ID"]
          profile = os.environ["PROFILE_UUID"]

          pattern = r'(?m)^(\s*)PRODUCT_BUNDLE_IDENTIFIER\s*=\s*[^;]+;'

          def replace(match):
              indent = match.group(1)
              return (
                  f'{indent}PRODUCT_BUNDLE_IDENTIFIER = "{bundle}";\n'
                  f'{indent}DEVELOPMENT_TEAM = "{team}";\n'
                  f'{indent}CODE_SIGN_STYLE = Manual;\n'
                  f'{indent}CODE_SIGN_IDENTITY = "Apple Distribution";\n'
                  f'{indent}PROVISIONING_PROFILE_SPECIFIER = "{profile}";\n'
              )

          updated, count = re.subn(pattern, replace, s)

          if count == 0:
              raise SystemExit(
                  "Could not find PRODUCT_BUNDLE_IDENTIFIER in App project"
              )

          pbx.write_text(updated)

          print(f"Updated {count} App build configurations")
          print(f"Bundle ID: {bundle}")
          print(f"Team ID: {team}")
          print(f"Provisioning profile: {profile}")
          PY

      # Archive the iOS application
      - name: Archive iOS application
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            | tee "$RUNNER_TEMP/archive.log" | tail -n 50

      # Export and upload to TestFlight
      - name: Export and upload to TestFlight
        run: |
          set -euo pipefail

          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>

            <key>destination</key>
            <string>upload</string>

            <key>teamID</key>
            <string>${TEAM_ID}</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>signingCertificate</key>
            <string>Apple Distribution</string>

            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>

            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/export.log" | tail -n 50

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarRoom-iOS-IPA
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Save logs if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WarRoom-iOS-Build-Logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7
