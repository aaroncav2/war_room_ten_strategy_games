s.']}\nfunction meters(){return '<div class=\"card meters\">'+Object.keys(MK).map(k=>{const v=S.m[k],w=MK[k][1]?v>=6:v<=3;return `<div><div class=\"l\"><span>${MK[k][0]}<\/span><b>${v.toFixed(1)}<\/b><\/div><div class=\"bar ${w?'w':''}\"><i style=\"width:${v*10}%\"><\/i><\/div><\/div>`}).join('')+'<\/div>'}\nfunction renderG(){\n let h='';\n if(S.phase==='brief')h=`<div class=\"card\"><h2>Briefing (open-source history)<\/h2><ul>\n <li>After the Gulf of Tonkin incident (Aug 1964) Congress passed the Tonkin Gulf Resolution on 7 Aug. Operation Rolling Thunder bombing of North Vietnam began in March 1965 and ended in 1968.<\/li>\n <li>US troop levels climbed from about 16,000 in 1963 to about 380,000 in 1966, 485,000 in 1967 and over 536,000 in 1968, peaking around 543,000.<\/li>\n <li>The Tet Offensive began 31 January 1968 with some 67,000 communist troops hitting population centers. Communist forces suffered heavy losses, yet public opinion in the US turned sharply. Westmoreland sought 200,000 more troops; Johnson refused and announced he would not run again.<\/li>\n <li>Nixon pursued Vietnamization and staged withdrawals from 1969; the Paris Accords were signed 27 Jan 1973; Saigon fell on 30 April 1975.<\/li><\/ul>\n <p>Each turn pick <b>3 actions<\/b> available in that phase. Chances depend on your metrics. Historical shocks then hit (some blunted by prior preparation), enemy pressure is resolved, and a random event lands. Try to leave behind a South that can stand without US troops, while keeping public support at home.<\/p>\n <p class=\"sub\">Simplified model, not a prediction; it explores trade-offs rather than judging who was right.<\/p><button onclick=\"go('plan')\">Begin: ${TN[0]}<\/button><\/div>`;\n else if(S.phase==='plan')h=meters()+`<div class=\"card\"><h2>${TN[S.t]} (${S.sel.length}/3 actions)<\/h2><div class=\"acts\">${avail().map(([a,i])=>`<div class=\"act ${S.sel.includes(i)?'on':''}\" onclick=\"pick(${i})\"><span class=\"pc\">${chance(a)}%<\/span><d ase==='brief')h=`<div class=\"card\"><h2>Briefing (open-source, early Nov 2026)<\/h2><ul>\n <li>Talks: the US is mediating working-level Russia\u2013Ukraine talks in Abu Dhabi on Nov 10\u201311, the first trilateral round since February. Russia has resisted European participation.<\/li>\n <li>Air war: Russia launched about 2,346 drones and 80+ missiles in the week to Nov 6, hammering the power grid.<\/li>\n <li>Deep strikes: Ukraine keeps hitting large Russian refineries; reports say Russian diesel exports are struggling.<\/li>\n <li>Ground: reporting indicates Russian territorial gains have dwindled sharply this year; fighting continues around Kostiantynivka and in Zaporizhzhia and Donetsk.<\/li>\n <li>Politics: Washington is pressing for a deal; Europe is financing and arguing over guarantees.<\/li><\/ul>\n <p>You have <b>six turns<\/b> (seasons). Pick <b>3 actions<\/b> each turn. Chances depend on your metrics. After your move Russia strikes the grid and pushes the line, attrition bites, and a random event lands. Survive, keep Washington and Western support on side, and make Moscow feel the strain.<\/p>\n <p class=\"sub\">This is a simplified game, not a forecast. Numbers are abstractions.<\/p><button onclick=\"go('plan')\">Begin: ${TN[0]}<\/button><\/div>`;\n else if(S.phase==='plan')h=meters()+`<div class=\"card\"><h2>${TN[S.t]} (${S.sel.length}/3 actions)<\/h2><div class=\"acts\">${A.map((a,i)=>!mine(a)?'':`<div class=\"act ${S.sel.includes(i)?'on':''}\" onclick=\"pick(${i})\"><span class=\"pc\">${chance(a)}%<\/span><div class=\"tag\">${a.c}<\/div><b>${a.n}<\/b><p>${a.d}<\/p><div class=\"chips\">${chips(a.s)}<\/div><\/div>`).join('')}<\/div><p><button onclick=\"run()\" ${S.sel.length?'':'disabled'}>Execute turn<\/button><\/p><\/div>`;\n else if(S.phase==='end')h=meters()+`<div class=\"card\"><h2>${S.end[0]}<\/h2><p>${S.end[1]}<\/p><p class=\"sub\">Reached turn ${Math.min(S.t,6)} of 6.<\/p><button onclick=\"init()\">Play again<\/button><\/div>`;\n if(S.phase!=='brief')h+=mapHTML()+pathHTML();\n if(S.log.length)h+=`<div class=\"card\"><h2 style=\"margin-top:0\">Log<\/h2><div class=\"log\">${S.log.map(e=>`<div class=\"${e.k||''}\">${e.t}<\/div>`).join('')}<\/div><\/div>`;\n return h}\nconst GM={keys:['front','grid','us'],drift:{front:-.5,grid:-1,arms:-.8,man:-.5,econ:-.3,us:.3,mor:-.2},\nlab:m=>m.front<=0||m.mor<=0||m.man<=0?['Defense collapses',0]:m.us>=10?['Imposed settlement',2]:m.rus>=7&&m.front>=5&&m.west>=5?['Favorable settlement',30+m.front]:m.front>=3.5&&m.mor>=3&&m.us<9?['Frozen conflict',20+m.front]:['Exhausted stalemate, bad terms',10+m.front],\nchk:[['Front-line position \u2265 5',m=>m.front>=5],['Energy grid \u2265 4',m=>m.grid>=4],['Interceptors and munitions \u2265 4',m=>m.arms>=4],['Manpower \u2265 4',m=>m.man>=4],['Western support \u2265 6',m=>m.west>=6],['Russian economic strain \u2265 7',m=>m.rus>=7],['US pressure to settle \u2264 7',m=>m.us<=7]],\nlegend:'Schematic, not to scale. The red line is the front; it shifts with your front-line metric (west = Ukraine losing ground). Red arrows are Russian strikes and pushes, blue arrows Ukrainian actions.',\nnotes:t=>{const m=S.m;return[`Front-line position ${m.front.toFixed(1)}/10: ${m.front>=6?'Ukraine is pushing the line east.':m.front>=4?'the line is roughly holding.':'the line is being pushed west.'}`,`Energy grid ${m.grid.toFixed(1)}/10: city markers show green / amber / red.`]},\nhist:[['Feb\u2013Apr 2022','Russia\\'s full-scale invasion; the drive on Kyiv from Belarus failed and forces withdrew by early April.'],['Autumn 2022','Ukraine retook much of Kharkiv Oblast (Sept) and Kherson city (Nov).'],['2023','Ukraine\\'s summer counteroffensive in Zaporizhzhia gained only limited ground.'],['Feb 2024','Russia took Avdiivka, followed by slow, costly advances in Donetsk Oblast.'],['Aug 2024','Ukraine\\'s incursion into Russia\\'s Kursk Oblast.'],['2025\u201326','Fighting centered on Pokrovsk and Kostiantynivka; Russian strikes on the energy grid and Ukrainian
